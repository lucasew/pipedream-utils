[tools]
node = "22.22.0"
npm = "11.11.0"
"ubi:lucasew/workspaced" = "0.1.6"

[tasks.lint]
run = "workspaced codebase lint"

[tasks.fmt]
run = "workspaced codebase format"

[tasks.install]
depends = ["install:*"]

[tasks."install:npm"]
run = "npm install"

[tasks.codegen]
depends = ["codegen:*"]

[tasks."codegen:dummy"]
run = "true"

[tasks.test]
depends = ["test:*"]

[tasks."test:npm"]
run = "npm run test:coverage"

[tasks.ci]
depends = ["lint", "test"]
